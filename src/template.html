<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="__ICON192__">
<title>Shred Looper</title>
<style>
:root{
  --bg:#0e0f12; --card:#16181d; --card2:#1e2128; --fg:#f5f6f8; --dim:#8b8f98;
  --accent:#e6b93c; --line:#272a31;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --band:repeating-linear-gradient(90deg, #23262e 0 18px, #3a3320 18px 22px);
}
body[data-theme="rhoads"]{
  --bg:#0a0a0c; --card:#131316; --card2:#1b1b20; --fg:#ffffff; --dim:#94949c;
  --accent:#e23b3b; --line:#232327;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --band:radial-gradient(circle at 8px 5px, #ffffff 2px, transparent 2.7px) 0 0/26px 10px repeat-x,
         radial-gradient(circle at 20px 7px, #ffffff 1.3px, transparent 1.9px) 0 0/34px 10px repeat-x,
         #151515;
}
body[data-theme="dolphin"]{
  --bg:#f4e6c0; --card:#fffaf0; --card2:#fdf3dd; --fg:#0b6b6b; --dim:#559089;
  --accent:#00a8c6; --line:#e8d9b4;
  --shadow:0 10px 24px rgba(160,120,40,.18);
  --band:radial-gradient(circle at 7px 5px, #ffffff 2px, transparent 2.7px) 0 0/24px 10px repeat-x,
         radial-gradient(circle at 16px 3px, rgba(255,255,255,.75) 1.3px, transparent 1.9px) 0 0/30px 10px repeat-x,
         #7ec8e8;
}
body[data-theme="world"]{
  /* dark wood + billiard ball colors */
  --bg:#20140c; --card:#2a1b10; --card2:#342214; --fg:#f3ead8; --dim:#a8916f;
  --accent:#3fae6a; --line:#3e2a18;
  --shadow:0 10px 30px rgba(0,0,0,.55);
  --band:radial-gradient(circle at 10px 5px, #f2b632 3px, transparent 3.6px) 0 0/60px 10px repeat-x,
         radial-gradient(circle at 25px 5px, #d64541 3px, transparent 3.6px) 0 0/60px 10px repeat-x,
         radial-gradient(circle at 40px 5px, #3b6bd6 3px, transparent 3.6px) 0 0/60px 10px repeat-x,
         radial-gradient(circle at 55px 5px, #8e44ad 3px, transparent 3.6px) 0 0/60px 10px repeat-x,
         #2a5c41;
}
body[data-theme="map"]{
  --bg:#0d0f13; --card:#171a21; --card2:#1f232d; --fg:#eef1f6; --dim:#8b92a1;
  --accent:#ffb020; --line:rgba(255,255,255,.09);
  --shadow:rgba(0,0,0,.55);
}
body[data-theme="backing"]{
  --bg:#0b0e11; --card:#14191e; --card2:#1c2329; --fg:#f4f7f9; --dim:#8d99a3;
  --accent:#35d0ba; --line:#262e35;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --band:repeating-linear-gradient(90deg, #35d0ba 0 3px, #1c2329 3px 44px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 44px;
  max-width:560px; margin:0 auto;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
#band{height:10px; border-radius:999px; margin:0 0 10px; background:var(--band);}
header{display:flex; align-items:center; justify-content:flex-start; gap:10px; padding:4px 2px 12px;}
h1{
  font-family:"Archivo Black", -apple-system, system-ui, sans-serif;
  font-size:clamp(20px,6vw,26px); margin:0; line-height:1.15; letter-spacing:.3px;
}
#diffline{
  display:inline-block; font-size:11px; font-weight:700; color:var(--dim);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px;
  margin-top:5px; font-variant-numeric:tabular-nums; letter-spacing:.3px;
}
#btnMap{min-width:48px; padding:0; font-size:20px;}

/* ---------------- overworld ---------------- */
#owWrap{
  position:relative; margin-top:4px; overflow:hidden; border-radius:24px;
  border:1px solid var(--line); box-shadow:0 24px 60px rgba(0,0,0,.5); background:var(--bg);
}
#owHero{
  position:absolute; top:0; left:0; right:0; z-index:4; pointer-events:none;
  padding:16px 18px 26px; background:linear-gradient(180deg, rgba(13,15,19,.94) 40%, rgba(13,15,19,0));
}
#owHero .t{font:800 15px/1 -apple-system, system-ui, sans-serif; letter-spacing:.14em; color:var(--fg);}
#owHero .s{font:500 12px/1.3 -apple-system, system-ui, sans-serif; color:var(--dim); margin-top:5px;}
#owPath{position:absolute; top:0; left:0; z-index:1; pointer-events:none;}
#owPath .dash{animation:owDash 2.4s linear infinite;}
.owWorldBg{position:absolute; left:0; right:0; z-index:0; overflow:hidden; pointer-events:none;}
.owWorldBg.w0{
  background:
    radial-gradient(72% 92% at 50% 55%, rgba(60,38,14,.30), transparent 72%),
    repeating-linear-gradient(90deg, rgba(120,80,30,.06) 0 2px, transparent 2px 30px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 15px),
    linear-gradient(180deg, #ead7ac, #dcc290);
}
.owWorldBg.w1{
  background:
    radial-gradient(120% 60% at 78% 6%, rgba(255,220,150,.10), transparent 55%),
    repeating-linear-gradient(176deg, transparent 0 58px, rgba(150,225,235,.035) 58px 62px, transparent 62px 128px),
    linear-gradient(180deg, #0f4051 0%, #0a2e40 46%, #06202f 100%);
}
.owWorldBg.w2{
  background:
    radial-gradient(90% 60% at 50% 30%, rgba(70,196,122,.06), transparent 60%),
    linear-gradient(180deg, #07130d, #0a1a12);
}
.owWorldBg.w3{
  background:
    radial-gradient(60% 34% at 28% 16%, rgba(255,255,255,.035), transparent 60%),
    radial-gradient(54% 40% at 76% 72%, rgba(0,0,0,.3), transparent 60%),
    linear-gradient(180deg, #1a1c1f, #131418);
}
.owCurb{position:absolute; top:26px; bottom:0; width:13px; border-radius:2px;}
.owCurb.l{left:6px; background:repeating-linear-gradient(135deg, rgba(209,56,44,.6) 0 13px, rgba(242,243,246,.4) 13px 26px);}
.owCurb.r{right:6px; background:repeating-linear-gradient(45deg, rgba(209,56,44,.6) 0 13px, rgba(242,243,246,.4) 13px 26px);}
.owFinale{position:absolute; left:0; width:100%; z-index:1; pointer-events:none;}

.owNode{position:absolute; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; z-index:3;}
.owNode.unlocked{cursor:pointer;}
.owBadge{font:700 10px/1 ui-monospace, "SF Mono", monospace; letter-spacing:.06em; padding:3px 8px; border-radius:999px; white-space:nowrap;}
.owNode.unlocked .owBadge{color:#1a1206; background:var(--accent); box-shadow:0 2px 6px var(--shadow);}
.owNode.locked .owBadge{color:var(--dim); background:var(--card2); border:1px solid var(--line); opacity:.9;}
.owBubble{width:60px; height:60px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px;}
.owNode.unlocked .owBubble{background:radial-gradient(120% 120% at 50% 25%, var(--card2), var(--card)); border:3px solid var(--accent); animation:owGlow 3.6s ease-in-out infinite;}
.owNode.locked .owBubble{background:var(--card); border:2px solid var(--line); filter:grayscale(1); opacity:.55; font-size:26px;}
.owTitle{font:700 13.5px/1.2 -apple-system, system-ui, sans-serif; text-wrap:balance;}
.owNode.unlocked .owTitle{color:var(--fg); text-shadow:0 1px 3px rgba(0,0,0,.65);}
.owSub{font:500 11px/1.2 -apple-system, system-ui, sans-serif; color:var(--dim);}
.owNode.unlocked .owSub{text-shadow:0 1px 2px rgba(0,0,0,.6);}
/* locked text sits on a solid scrim so it reads over any world's backdrop art */
.owLockText{background:rgba(0,0,0,.5); border-radius:8px; padding:4px 8px; display:flex; flex-direction:column; gap:2px;}
.owLockText .owTitle{color:#e7eaf1;}
.owLockText .owSub{color:#aab0bd;}
.owNode.boss .owBadge{font-weight:800; letter-spacing:.12em; padding:3px 10px;}
.owNode.boss.unlocked .owBadge{color:#2a0806; background:linear-gradient(180deg,#ffb020,#ff5140); box-shadow:0 2px 8px rgba(255,81,64,.45);}
.owNode.boss.locked .owBadge{border:1px solid rgba(255,81,64,.4);}
.owNode.boss .owBubble{width:74px; height:74px; font-size:34px;}
.owNode.boss.unlocked .owBubble{background:radial-gradient(120% 120% at 50% 22%,#2a2230,#171018); border:4px solid #ff5140; animation:owBossGlow 2.6s ease-in-out infinite;}
.owNode.boss.locked .owBubble{background:var(--card); border:3px solid rgba(255,81,64,.5); filter:grayscale(.7); opacity:.62; font-size:32px;}
.owNode.boss .owTitle{font:800 14px/1.2 -apple-system, system-ui, sans-serif;}
.owNode.boss.unlocked .owSub{color:#ff8f80;}
/* w0's pale wood backdrop needs dark text, not the usual light-on-dark treatment */
.owNode.w0.unlocked .owTitle{color:#2a1a08; text-shadow:0 1px 1px rgba(255,255,255,.4);}
.owNode.w0.unlocked .owSub{color:#4a3018; text-shadow:0 1px 1px rgba(255,255,255,.4);}
@keyframes owDash{ to{ stroke-dashoffset:-28; } }
@keyframes owGlow{
  0%,100%{ box-shadow:0 6px 16px var(--shadow), 0 0 0 6px rgba(255,176,32,.10); }
  50%{ box-shadow:0 6px 20px var(--shadow), 0 0 0 8px rgba(255,176,32,.18); }
}
@keyframes owBossGlow{
  0%,100%{ box-shadow:0 6px 18px var(--shadow), 0 0 0 4px rgba(255,81,64,.9), 0 0 0 9px rgba(255,81,64,.14); }
  50%{ box-shadow:0 6px 24px var(--shadow), 0 0 0 4px rgba(255,81,64,1), 0 0 0 12px rgba(255,81,64,.22); }
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  padding:14px; margin-top:14px; box-shadow:var(--shadow);
}
.card h3{margin:0 0 10px; font-size:11px; color:var(--dim); letter-spacing:1.4px; text-transform:uppercase; font-weight:700;}
#laneCard{padding:10px;}
canvas#lane{width:100%; height:28vh; max-height:260px; display:block;
  background:var(--card2); border-radius:12px;}
canvas#sectionsStrip{width:100%; display:block; margin-bottom:6px;}
#loopInfo{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; min-height:16px; margin-top:8px; text-align:center;}
#songMeta{font-size:10.5px; color:var(--dim); opacity:.65; font-variant-numeric:tabular-nums; text-align:center; margin-top:2px;}
.row{display:flex; gap:8px; align-items:center;}
.row + .row{margin-top:8px;}
button{
  background:var(--card2); color:var(--fg); border:1px solid var(--line);
  border-radius:13px; font:inherit; font-size:15px; font-weight:600;
  padding:0 14px; min-height:48px; min-width:48px; cursor:pointer;
  transition:transform .06s, opacity .15s;
}
button:active{transform:scale(.965);}
button.on{border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
#btnPlay{
  flex:1; background:var(--fg); color:var(--bg); border-color:var(--fg);
  font-size:17px; font-weight:800; min-height:54px; border-radius:15px;
}
.nudge button{flex:1; font-variant-numeric:tabular-nums;}
#pctBig{font-size:38px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; letter-spacing:.5px;}
#bpmSmall{font-size:12px; color:var(--dim); text-align:center; font-variant-numeric:tabular-nums; margin-bottom:4px;}
input[type=range]{width:100%; min-height:44px; accent-color:var(--accent);}
.presets{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:8px;}
.presets button{min-width:0; min-height:42px; padding:0; font-size:13px; font-variant-numeric:tabular-nums;}
.seg{display:flex; background:var(--card2); border:1px solid var(--line); border-radius:13px; padding:4px; gap:4px;}
.seg button{flex:1; border:none; background:transparent; min-height:42px;}
.seg button.on{background:var(--fg); color:var(--bg); box-shadow:none; border-radius:10px;}
#sections{display:flex; flex-wrap:wrap; gap:8px;}
#sections button{font-size:13px; text-align:left; line-height:1.3; padding:9px 13px;}
#sections .sub{display:block; font-size:10.5px; color:var(--dim); font-weight:500; font-variant-numeric:tabular-nums; font-style:normal;}
.trainer{display:flex; align-items:center; gap:10px; font-size:13px; margin-top:10px; color:var(--dim);}
.trainer input{
  background:var(--card2); color:var(--fg); border:1px solid var(--line);
  border-radius:10px; font:inherit; font-size:15px; padding:8px; min-height:42px;
  width:60px; text-align:center;
}

/* ---------------- backing track ---------------- */
#btnBacking{width:100%; margin-bottom:12px; background:var(--card); box-shadow:0 8px 20px rgba(0,0,0,.35);}
#btBand{height:10px; border-radius:999px; margin:0 0 10px; background:var(--band);}
#btBack{min-width:48px; padding:0; font-size:20px;}
#btDisplay{position:sticky; top:calc(env(safe-area-inset-top) + 6px); z-index:5; margin-top:0; text-align:center;}
#btKeyBig{font-size:34px; font-weight:800; line-height:1.1; margin-bottom:10px;}
#btChips{display:grid; gap:8px;}
.btChip{
  background:var(--card2); border:1px solid var(--line); border-radius:14px;
  padding:10px 2px; min-width:0; overflow:hidden; white-space:nowrap;
}
.btChip .n{font-size:22px; font-weight:700; color:var(--dim);}
.btChip .c{font-size:30px; font-weight:800; line-height:1.15;}
.btChip.now{background:var(--accent); border-color:var(--accent); color:#06231f;}
.btChip.now .n{color:#06231f;}
#btNextRow{display:flex; justify-content:center; align-items:baseline; gap:10px; margin-top:8px; min-height:50px;}
#btNext{font-size:20px; font-weight:600; color:var(--dim); white-space:nowrap;}
#btCountdown{font-size:42px; font-weight:800; font-variant-numeric:tabular-nums;}
#btBar{font-size:18px; font-weight:600; color:var(--dim); font-variant-numeric:tabular-nums; margin:4px 0 12px;}
#btPlay{
  flex:1; background:var(--fg); color:var(--bg); border-color:var(--fg);
  font-size:20px; font-weight:800; min-height:60px; border-radius:15px;
}
#btPlay:disabled{opacity:.4;}
#btCountIn{min-height:60px;}
#btDice{min-height:60px; font-size:24px;}
#btKeys{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
#btKeys button{min-width:0; padding:0; font-size:16px;}
.btText{
  width:100%; background:var(--card2); color:var(--fg); border:1px solid var(--line);
  border-radius:13px; font:inherit; font-size:18px; font-weight:600; padding:0 14px; min-height:50px;
  user-select:text; -webkit-user-select:text;
}
.btText.bad{border-color:#e5484d;}
#btErr{font-size:14px; font-weight:600; color:#ff8589; min-height:18px; margin-top:6px;}
#btPresets{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
#btPresets button{font-size:14px; min-height:44px;}
#btSaveRow .btText{flex:1; min-width:0; font-size:16px; min-height:48px;}
#btDelete{display:none;}
#btBpmBig{font-size:44px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums;}
#btBpmRow button{flex:1; font-variant-numeric:tabular-nums;}
.btPart{display:flex; align-items:center; gap:10px;}
.btPart + .btPart{margin-top:4px;}
.btPart span{width:48px; font-size:14px; font-weight:600;}
.btPart input{flex:1; min-width:0;}
.btPart button{min-width:70px; font-size:14px;}
</style>
</head>
<body>
<div id="mapScreen">
  <button id="btnBacking">Backing Track</button>
  <div id="owWrap">
    <div id="owHero">
      <div class="t">SHRED&#8202;LOOPER</div>
      <div class="s">Pick a run to start looping</div>
    </div>
    <svg id="owPath"></svg>
  </div>
</div>

<div id="playScreen" style="display:none">
<div id="band"></div>
<header>
  <button id="btnMap">🗺️</button>
  <div>
    <h1 id="title">Shred Looper</h1>
    <div id="diffline"></div>
  </div>
</header>

<div class="card" id="laneCard">
  <canvas id="sectionsStrip"></canvas>
  <canvas id="lane"></canvas>
  <div id="loopInfo"></div>
  <div id="songMeta"></div>
</div>

<div class="card">
  <div class="row">
    <button id="btnPlay">Play</button>
    <button id="btnStop">Stop</button>
    <button id="btnLoop">Loop</button>
    <button id="btnClear">Clear</button>
  </div>
  <div class="row nudge">
    <button id="nShiftL">−½ shift</button>
    <button id="nShiftR">+½ shift</button>
    <button id="nSizeD">−½ len</button>
    <button id="nSizeU">+½ len</button>
  </div>
</div>

<div class="card">
  <h3>Tempo</h3>
  <div id="pctBig">100%</div>
  <div id="bpmSmall"></div>
  <input type="range" id="tempo" min="20" max="110" value="100" step="1">
  <div class="presets">
    <button data-pct="20">20</button><button data-pct="30">30</button>
    <button data-pct="40">40</button><button data-pct="50">50</button>
    <button data-pct="60">60</button><button data-pct="70">70</button>
    <button data-pct="75">75</button><button data-pct="80">80</button>
    <button data-pct="85">85</button><button data-pct="90">90</button>
    <button data-pct="95">95</button><button data-pct="100">100</button>
    <button data-pct="105">105</button><button data-pct="110">110</button>
  </div>
  <div class="trainer">
    <button id="btnTrainer">Trainer</button>
    <span>+1% every</span><input type="number" id="trainN" value="4" min="1" max="99">
    <span>loops</span>
  </div>
</div>

<div class="card">
  <h3>Backing</h3>
  <div class="seg">
    <button data-back="off">Off</button>
    <button data-back="click">Click</button>
    <button data-back="drums" class="on">Drums</button>
  </div>
</div>

<div class="card">
  <h3>Sections</h3>
  <div id="sections"></div>
</div>
</div>

<div id="btScreen" style="display:none">
<div id="btBand"></div>
<header>
  <button id="btBack">🗺️</button>
  <h1>🥁 Backing Track</h1>
</header>

<div class="card" id="btDisplay">
  <div id="btKeyBig"></div>
  <div id="btChips"></div>
  <div id="btNextRow"><span id="btNext"></span><span id="btCountdown"></span></div>
  <div id="btBar"></div>
  <div class="row">
    <button id="btPlay">Play</button>
    <button id="btCountIn">Count-in</button>
    <button id="btDice">🎲</button>
  </div>
</div>

<div class="card">
  <h3>Key</h3>
  <div id="btKeys"></div>
</div>

<div class="card">
  <h3>Progression</h3>
  <input class="btText" id="btProg" type="text" placeholder="vi vi I V" enterkeyhint="done"
         autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">
  <div id="btErr"></div>
  <div id="btPresets"></div>
  <div class="row" id="btSaveRow" style="margin-top:10px">
    <input class="btText" id="btPresetName" type="text" placeholder="Preset name" enterkeyhint="done"
           autocorrect="off" autocomplete="off" spellcheck="false">
    <button id="btSave">Save</button>
    <button id="btDelete">Delete</button>
  </div>
</div>

<div class="card">
  <h3>Bars per chord</h3>
  <div class="seg" id="btBars">
    <button data-v="0.5">1/2</button><button data-v="1">1</button><button data-v="2">2</button><button data-v="4">4</button>
  </div>
</div>

<div class="card">
  <h3>BPM</h3>
  <div id="btBpmBig"></div>
  <input type="range" id="btBpm" min="40" max="200" step="1">
  <div class="row" id="btBpmRow">
    <button data-d="-5">−5</button><button data-d="-1">−1</button>
    <button data-d="1">+1</button><button data-d="5">+5</button>
  </div>
</div>

<div class="card">
  <h3>Bass</h3>
  <div class="seg" id="btBass">
    <button data-v="eighths">Eighths</button><button data-v="quarters">Quarters</button><button data-v="off">Off</button>
  </div>
</div>

<div class="card">
  <h3>Mix</h3>
  <div class="btPart"><span>Drums</span><input type="range" min="0" max="150" data-part="drums"><button data-mute="drums">Mute</button></div>
  <div class="btPart"><span>Bass</span><input type="range" min="0" max="150" data-part="bass"><button data-mute="bass">Mute</button></div>
  <div class="btPart"><span>Pad</span><input type="range" min="0" max="150" data-part="pad"><button data-mute="pad">Mute</button></div>
</div>
</div>

<script>
'use strict';
const DATA = "__DATA_JSON__";

/* ---------------- state ---------------- */
const LS = 'shredlooper.v1.';
let song = null;
let notes = [];
let totalBeats = 0;
let ctx = null, master = null, leadGain = null, backGain = null;
let playBus = null;         // per-play gain: pause/stop silences instantly
let drumBufs = {};
let playing = false, warmed = false;
let token = 0;              // intent token: bump cancels in-flight play/sched
let V0 = 0, T0 = 0, spb = 0.5, schedV = 0;
let curBeat = 0;
let loopOn = false, loopA = 0, loopB = 0;
let pct = 100, backing = 'drums';
let trainerOn = false, loopCount = 0;
let schedTimer = null;
const LOOKAHEAD = 0.18, TICK = 30;

const $ = (id) => document.getElementById(id);
const BEND_SCALE = 1, LEAD_VOL = 0.9, BACK_VOL = 0.8;

/* ---------------- persistence ---------------- */
function saveState(){
  try{ localStorage.setItem(LS + song.id, JSON.stringify({
    pct, backing, trainN: +$('trainN').value,
  })); }catch(e){}
}
function loadState(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(LS + song.id) || 'null'); }catch(e){}
  pct = s && s.pct || 100;
  loopOn = false; loopA = 0; loopB = 0;   // always init with no loop
  backing = (s && s.backing) || 'drums';
  $('trainN').value = s && s.trainN ? s.trainN : 4;
}

/* ---------------- audio core ---------------- */
function ensureCtx(){
  if(ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.connect(ctx.destination);
  leadGain = ctx.createGain(); leadGain.connect(master);
  backGain = ctx.createGain(); backGain.connect(master);
  const b64 = (u) => {
    const raw = atob(u.split(',')[1]);
    const a = new Uint8Array(raw.length);
    for(let i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a.buffer;
  };
  for(const k of ['kick','snare','hat']){
    ctx.decodeAudioData(b64(DATA.drums[k]),
      (buf) => { drumBufs[k] = buf; },
      () => { console.warn('drum decode failed', k); });
  }
}
function warmup(){
  const buf = ctx.createBuffer(1, 220, ctx.sampleRate);
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(master); src.start();
}
function applyVols(){
  if(!ctx) return;
  leadGain.gain.value = LEAD_VOL;
  backGain.gain.value = BACK_VOL;
}

/* pluck voice: dual detuned saws -> lowpass with envelope -> gain env */
function pluck(t, note, spbNow){
  const f0 = 440 * Math.pow(2, (note.p - 69) / 12);
  const vel = note.v / 127;
  const dur = Math.max(0.05, note.d * spbNow);
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  o1.type = 'sawtooth'; o2.type = 'sawtooth';
  o1.detune.value = -7; o2.detune.value = 7;
  const semi2f = (s) => f0 * Math.pow(2, (s * BEND_SCALE) / 12);
  let fStart = f0;
  if(note.bd && note.bd.length && note.bd[0][0] <= 1e-6) fStart = semi2f(note.bd[0][1]);
  o1.frequency.setValueAtTime(fStart, t);
  o2.frequency.setValueAtTime(fStart, t);
  if(note.bd){
    for(const [off, semi] of note.bd){
      if(off <= 1e-6) continue;
      const bt = Math.min(t + off * spbNow, t + dur);
      o1.frequency.linearRampToValueAtTime(semi2f(semi), bt);
      o2.frequency.linearRampToValueAtTime(semi2f(semi), bt);
    }
  }
  const filt = ctx.createBiquadFilter();
  filt.type = 'lowpass'; filt.Q.value = 1.2;
  const c0 = Math.min(11000, 900 + f0 * 7);
  filt.frequency.setValueAtTime(c0, t);
  filt.frequency.exponentialRampToValueAtTime(Math.max(300, f0 * 1.6),
      t + Math.min(0.35, dur));
  const g = ctx.createGain();
  const peak = 0.16 + 0.34 * vel;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.004);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak * 0.35),
      t + Math.max(0.03, Math.min(0.25, dur * 0.6)));
  g.gain.setTargetAtTime(0.0001, t + dur - 0.02, 0.018);
  o1.connect(filt); o2.connect(filt); filt.connect(g); g.connect(playBus);
  o1.start(t); o2.start(t);
  o1.stop(t + dur + 0.2); o2.stop(t + dur + 0.2);
}
function hitDrum(name, t, gain){
  const buf = drumBufs[name];
  if(!buf) return;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = gain;
  src.connect(g); g.connect(playBus);
  src.start(t);
}
function clickTick(t, accent){
  // lower + louder per feedback
  const o = ctx.createOscillator(); o.type = 'square';
  o.frequency.value = accent ? 660 : 440;
  const g = ctx.createGain();
  g.gain.setValueAtTime(accent ? 0.95 : 0.75, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g); g.connect(playBus);
  o.start(t); o.stop(t + 0.08);
}

/* ---------------- beat clock + scheduler ---------------- */
function secPerBeat(){ return 60 / (song.origBpm * pct / 100); }
function vAt(t){ return V0 + (t - T0) / spb; }
function timeOfV(v){ return T0 + (v - V0) * spb; }
function foldV(v){
  if(!loopOn || loopB - loopA < 0.5 || v < loopA) return v;
  return loopA + ((v - loopA) % (loopB - loopA));
}
function lowerBound(arr, b){
  let lo = 0, hi = arr.length;
  while(lo < hi){ const m = (lo + hi) >> 1; if(arr[m].b < b - 1e-9) lo = m + 1; else hi = m; }
  return lo;
}
function scheduleSegment(songA, songB, vBase){
  let i = lowerBound(notes, songA);
  while(i < notes.length && notes[i].b < songB - 1e-9){
    const n = notes[i];
    pluck(timeOfV(vBase + (n.b - songA)), n, spb);
    i++;
  }
  if(backing !== 'off'){
    let g = Math.ceil((songA - 1e-9) / 0.5) * 0.5;
    for(; g < songB - 1e-9; g += 0.5){
      const t = timeOfV(vBase + (g - songA));
      const inBar = ((g % 4) + 4) % 4;
      if(backing === 'drums'){
        if(inBar === 0 || inBar === 2) hitDrum('kick', t, 1.0);
        if(inBar === 1 || inBar === 3) hitDrum('snare', t, 0.95);
        hitDrum('hat', t, 0.7);
      }else if(Number.isInteger(inBar)){
        clickTick(t, inBar === 0);
      }
    }
  }
}
function schedulerTick(myToken){
  if(myToken !== token || !playing) return;
  const horizon = vAt(ctx.currentTime + LOOKAHEAD);
  while(schedV < horizon){
    const s = foldV(schedV);
    let end = horizon;
    if(loopOn && loopB - loopA >= 0.5 && schedV >= loopA - 1e-9){
      end = Math.min(end, schedV + (loopB - s));
    }
    if(end <= schedV + 1e-9){ schedV += 0.001; continue; }
    scheduleSegment(s, s + (end - schedV), schedV);
    const wrapped = loopOn && loopB - loopA >= 0.5 &&
        foldV(end) < foldV(schedV + 1e-9) - 1e-6;
    schedV = end;
    if(wrapped){
      loopCount++;
      if(trainerOn){
        const N = Math.max(1, +$('trainN').value || 4);
        if(loopCount % N === 0 && pct < 110) setPct(pct + 1, true);
      }
    }
  }
}

/* ---------------- transport ---------------- */
function startPlayback(fromBeat){
  ensureCtx();
  const myToken = ++token;
  const go = () => {
    if(myToken !== token) return;
    warmup();
    playBus = ctx.createGain(); playBus.connect(leadGain);
    applyVols();
    const headroom = warmed ? 0.12 : 0.30;
    warmed = true;
    spb = secPerBeat();
    T0 = ctx.currentTime + headroom;
    V0 = fromBeat; schedV = fromBeat;
    playing = true;
    $('btnPlay').textContent = 'Pause';
    schedulerTick(myToken);
    schedTimer = setInterval(() => schedulerTick(myToken), TICK);
  };
  if(ctx.state === 'suspended') ctx.resume().then(go).catch(go);
  else go();
}
function killVoices(){
  if(schedTimer){ clearInterval(schedTimer); schedTimer = null; }
  if(playBus && ctx){
    playBus.gain.setValueAtTime(0, ctx.currentTime);
    const pb = playBus;
    setTimeout(() => { try{ pb.disconnect(); }catch(e){} }, 60);
  }
  playBus = null;
}
function pause(){
  if(!playing) return;
  curBeat = foldV(vAt(ctx.currentTime));
  ++token; playing = false;
  killVoices();
  $('btnPlay').textContent = 'Play';
}
function stop(){
  ++token;
  curBeat = loopOn ? loopA : 0;
  playing = false;
  killVoices();
  $('btnPlay').textContent = 'Play';
  draw();
}
function togglePlay(){
  if(playing) pause();
  else {
    let b = curBeat;
    if(loopOn && (b < loopA - 8 || b >= loopB)) b = loopA;
    startPlayback(b);
  }
}
function seek(beat){
  beat = Math.max(0, Math.min(totalBeats, beat));
  const wasPlaying = playing;
  if(playing){ ++token; killVoices(); playing = false; }
  curBeat = beat;
  if(wasPlaying) startPlayback(beat);
  draw();
}
function setPct(p, silent){
  pct = Math.max(20, Math.min(110, Math.round(p)));
  $('tempo').value = pct;
  $('pctBig').textContent = pct + '%';
  const bpm = song.origBpm * pct / 100;
  $('bpmSmall').textContent = bpm.toFixed(1) + ' bpm';
  const secs = Math.round(totalBeats * 60 / bpm);
  $('songMeta').textContent = song.totalBars + ' bars · ' +
      Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0') +
      ' · ' + notes.length + ' notes';   // every block: double stops count as 2
  if(playing && ctx){
    const now = ctx.currentTime;
    V0 = vAt(now); T0 = now; spb = secPerBeat();
  }
  if(!silent) saveState();
}

/* ---------------- loop controls ---------------- */
function setLoop(a, b, on){
  loopA = Math.max(0, a); loopB = Math.min(totalBeats, b);
  loopOn = on == null ? true : on;
  updateLoopUI(); saveState(); draw();
}
function clearLoop(){ loopOn = false; loopA = loopB = 0; updateLoopUI(); saveState(); draw(); }
function updateLoopUI(){
  $('btnLoop').classList.toggle('on', loopOn);
  if(loopOn && loopB > loopA){
    const bo = song.barOffset;
    const b1 = (loopA / 4 + 1 + bo), bars = (loopB - loopA) / 4;
    const fmt = (x) => (Math.abs(x - Math.round(x)) < 0.005 ? Math.round(x) : x.toFixed(2));
    $('loopInfo').textContent = 'bar ' + fmt(b1) + ' · ' +
        fmt(bars) + ' bar' + (bars !== 1 ? 's' : '') + ' · loops: ' + loopCount;
  } else $('loopInfo').textContent = '';
}
function shiftLoop(d){ if(loopOn){ setLoop(loopA + d, loopB + d); } }
function resizeLoop(d){ if(loopOn && loopB + d > loopA + 1){ setLoop(loopA, loopB + d); } }

/* ---------------- sections strip: hardest gets its own lane, rest packed non-overlapping ---------------- */
const secStrip = $('sectionsStrip');
let secCtx = secStrip.getContext('2d');
let secHits = [];  // [{a,b,x0,x1,y0,y1}] in CSS px, for tap-to-loop
const SEC_ROW_H = 9, SEC_GAP = 4;
function packRows(items){
  const rows = [];  // each row: last end beat
  const placed = [];
  for(const it of items.slice().sort((a, b) => a.a - b.a)){
    let r = rows.findIndex((end) => it.a >= end - 1e-6);
    if(r === -1){ r = rows.length; rows.push(0); }
    rows[r] = it.b;
    placed.push({ ...it, row: r });
  }
  return { placed, rowCount: Math.max(1, rows.length) };
}
function renderSectionsStrip(){
  const dpr2 = window.devicePixelRatio || 1;
  const others = song.sections;
  const { placed, rowCount } = packRows(others);
  const totalRows = 1 + rowCount;  // hardest lane + packed section lanes
  const cssW = secStrip.clientWidth || lane.clientWidth;
  const cssH = totalRows * SEC_ROW_H + (totalRows - 1) * SEC_GAP;
  secStrip.style.height = cssH + 'px';
  secStrip.width = cssW * dpr2; secStrip.height = cssH * dpr2;
  secCtx.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  secCtx.clearRect(0, 0, cssW, cssH);
  const x = (b) => b / totalBeats * cssW;
  secHits = [];
  const drawBar = (a, b, row, fill, alpha) => {
    const y0 = row * (SEC_ROW_H + SEC_GAP);
    const bx = x(a), bw = Math.max(3, x(b) - x(a));
    secCtx.globalAlpha = alpha;
    secCtx.fillStyle = fill;
    secCtx.beginPath();
    secCtx.roundRect(bx, y0, bw, SEC_ROW_H, 3);
    secCtx.fill();
    secCtx.globalAlpha = 1;
    secHits.push({ a, b, x0: bx, x1: bx + bw, y0, y1: y0 + SEC_ROW_H });
  };
  const hz = song.hardest;
  drawBar(hz.a, hz.b, 0, themeCols.accent, 0.55);
  for(const it of placed) drawBar(it.a, it.b, 1 + it.row, themeCols.dim, 0.35);
}
secStrip.addEventListener('pointerup', (e) => {
  const r = secStrip.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = secHits.find((h) => px >= h.x0 && px <= h.x1 && py >= h.y0 && py <= h.y1);
  if(hit){ setLoop(hit.a, hit.b, true); loopCount = 0; seek(hit.a); }
});

/* ---------------- canvas ---------------- */
const lane = $('lane');
let laneCtx = lane.getContext('2d');
let staticCanvas = null, dpr = 1, W = 0, H = 0;
let themeCols = null, geom = null;
function renderStatic(){
  dpr = window.devicePixelRatio || 1;
  W = lane.clientWidth; H = lane.clientHeight;
  lane.width = W * dpr; lane.height = H * dpr;
  staticCanvas = document.createElement('canvas');
  staticCanvas.width = W * dpr; staticCanvas.height = H * dpr;
  const c = staticCanvas.getContext('2d');
  c.scale(dpr, dpr);
  const css = getComputedStyle(document.body);
  themeCols = {
    grid: css.getPropertyValue('--line').trim(),
    fg: css.getPropertyValue('--fg').trim(),
    accent: css.getPropertyValue('--accent').trim(),
    dim: css.getPropertyValue('--dim').trim(),
  };
  const stripH = 16, laneH = H - stripH;
  let minP = 127, maxP = 0;
  for(const n of notes){ minP = Math.min(minP, n.p); maxP = Math.max(maxP, n.p); }
  minP -= 2; maxP += 2;
  const x = (b) => b / totalBeats * W;
  const y = (p) => laneH - (p - minP) / (maxP - minP) * (laneH - 8) - 4;
  for(let b = 0; b <= totalBeats; b += 2){
    c.strokeStyle = themeCols.grid;
    c.lineWidth = (b % 4 === 0) ? 1.5 : 0.5;
    c.beginPath(); c.moveTo(x(b), 0); c.lineTo(x(b), laneH); c.stroke();
  }
  c.font = '9px ui-monospace, Menlo, monospace';
  c.fillStyle = themeCols.dim; c.textAlign = 'left';
  const barStep = totalBeats / 4 > 20 ? 2 : 1;
  for(let bar = 0; bar < totalBeats / 4; bar += barStep){
    c.fillText(String(bar + 1 + song.barOffset), x(bar * 4) + 2, H - 4);
  }
  const noteH = Math.max(3, laneH / (maxP - minP) * 0.9);
  geom = { minP, maxP, noteH, laneH };
  for(const n of notes){
    c.fillStyle = themeCols.accent;   // notes lead with the theme's hot color
    c.fillRect(x(n.b), y(n.p) - noteH / 2,
               Math.max(2, n.d / totalBeats * W), noteH);
  }
}
function draw(){
  if(!staticCanvas) return;
  laneCtx.setTransform(1, 0, 0, 1, 0, 0);
  laneCtx.clearRect(0, 0, lane.width, lane.height); // static layer is transparent: must wipe
  laneCtx.drawImage(staticCanvas, 0, 0);
  laneCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const stripH = 16, laneH = H - stripH;
  const x = (b) => b / totalBeats * W;
  if(loopOn && loopB > loopA && geom){
    // loop indication: notes inside the loop take the secondary color
    const y = (p) => geom.laneH - (p - geom.minP) / (geom.maxP - geom.minP) * (geom.laneH - 8) - 4;
    laneCtx.fillStyle = themeCols.fg;
    let i = lowerBound(notes, loopA);
    while(i < notes.length && notes[i].b < loopB - 1e-9){
      const n = notes[i];
      laneCtx.fillRect(x(n.b), y(n.p) - geom.noteH / 2,
                       Math.max(2, n.d / totalBeats * W), geom.noteH);
      i++;
    }
  }
  const b = playing && ctx ? foldV(vAt(ctx.currentTime)) : curBeat;
  laneCtx.fillStyle = themeCols.dim;  // neutral playhead
  laneCtx.globalAlpha = 0.95;
  laneCtx.fillRect(Math.min(x(b), W - 2), 0, 2, laneH);
  laneCtx.globalAlpha = 1;
}
function rafLoop(){
  draw();  // always: no stale overlays after loop toggle/clear
  if(playing){
    if(!loopOn && ctx && vAt(ctx.currentTime) >= totalBeats + 0.5) stop();
    if(loopOn) updateLoopUI();
  }
  requestAnimationFrame(rafLoop);
}

/* lane pointer: drag = set loop (snap half-bar), tap = seek */
let pDown = null, pDrag = false;
lane.addEventListener('pointerdown', (e) => {
  const r = lane.getBoundingClientRect();
  pDown = { x: e.clientX, beat: (e.clientX - r.left) / r.width * totalBeats };
  pDrag = false;
  lane.setPointerCapture(e.pointerId);
});
lane.addEventListener('pointermove', (e) => {
  if(!pDown) return;
  if(Math.abs(e.clientX - pDown.x) > 8) pDrag = true;
  if(pDrag){
    const r = lane.getBoundingClientRect();
    const b2 = (e.clientX - r.left) / r.width * totalBeats;
    const a = Math.floor(Math.min(pDown.beat, b2) / 2) * 2;
    const b = Math.ceil(Math.max(pDown.beat, b2) / 2) * 2;
    if(b > a) setLoop(a, b, true);
  }
});
lane.addEventListener('pointerup', (e) => {
  if(pDown && !pDrag){
    seek(Math.round(pDown.beat / 2) * 2);
  }
  pDown = null; pDrag = false;
});

/* ---------------- songs + sections UI ---------------- */
function fmtBar(beat){
  const v = beat / 4 + 1 + song.barOffset;
  return Math.abs(v - Math.round(v)) < 0.005 ? String(Math.round(v)) : v.toFixed(2);
}
function loadSong(idx){
  stop();
  song = DATA.songs[idx];
  notes = song.notes;
  totalBeats = song.totalBars * 4;
  document.body.dataset.theme = song.theme;
  $('title').textContent = song.emoji + ' ' + song.name;
  const hz = song.hardest;
  const tag = hz.eq16 < 120 ? 'easy' : hz.eq16 < 160 ? 'medium'
            : hz.eq16 < 180 ? 'hard' : 'really hard';
  $('diffline').textContent = tag + ' (' + hz.eq16 + 'e)';
  loadState();
  loopCount = 0;
  curBeat = loopOn ? loopA : 0;
  setPct(pct, true);
  for(const b of document.querySelectorAll('[data-back]'))
    b.classList.toggle('on', b.dataset.back === backing);
  const secWrap = $('sections');
  secWrap.innerHTML = '';
  const mk = (label, a, b, extra) => {
    const btn = document.createElement('button');
    btn.innerHTML = label + '<span class="sub">bar ' + fmtBar(a) + ' → ' +
        Math.ceil(b / 4 + song.barOffset) + ' · ' + ((b - a) / 4) + ' bars' +
        (extra || '') + '</span>';
    btn.onclick = () => { setLoop(a, b, true); loopCount = 0; seek(a); };
    secWrap.appendChild(btn);
  };
  mk('⚡ Hardest', hz.a, hz.b, ' · ≈' + hz.eq16);
  for(const s of song.sections) mk(s.name, s.a, s.b);
  renderStatic(); renderSectionsStrip(); updateLoopUI(); draw();
  saveState();
}

/* ---------------- backing track: chord theory ---------------- */
const BT_KEYS = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
const BT_LETTERS = 'CDEFGAB';
const BT_MAJOR = [0, 2, 4, 5, 7, 9, 11];   // semitones of each major scale degree
const BT_ROMAN = { i: 0, ii: 1, iii: 2, iv: 3, v: 4, vi: 5, vii: 6 };
const BT_PRESETS = [
  { name: 'vi vi I V (Crazy Train)', prog: 'vi vi I V' },
  { name: 'I V vi IV', prog: 'I V vi IV' },
  { name: 'I IV V IV', prog: 'I IV V IV' },
  { name: 'vi IV I V', prog: 'vi IV I V' },
  { name: 'ii V I I', prog: 'ii V I I' },
];

function btParseChord(tok){
  const m = /^(b?)(i{1,3}|iv|vi{0,2}|I{1,3}|IV|VI{0,2})(°|dim)?$/.exec(tok);
  if(!m) return null;
  const q = m[3] ? 'dim' : (m[2] === m[2].toUpperCase() ? 'maj' : 'min');
  return {
    num: m[1] + m[2] + (m[3] ? '°' : ''),
    degree: BT_ROMAN[m[2].toLowerCase()],
    flat: m[1] ? 1 : 0,
    q,
  };
}
/* Spell the root from the key's scale so A gets F#m and Bb gets Eb.
   A double accidental (bII in Db) collapses to its plain name, D not Ebb. */
function btSpellRoot(keyIdx, degree, pc){
  const keyLetter = BT_LETTERS.indexOf(BT_KEYS[keyIdx][0]);
  const letterIdx = (keyLetter + degree) % 7;
  const diff = ((pc - BT_MAJOR[letterIdx] + 18) % 12) - 6;
  if(Math.abs(diff) > 1) return BT_KEYS[pc];
  return BT_LETTERS[letterIdx] + (diff === 1 ? '#' : diff === -1 ? 'b' : '');
}
/* Returns {plan} or {bad: token}. An empty string has bad: ''. */
function btBuildPlan(keyIdx, progText, per){
  const toks = progText.trim().split(/[\s,|\-]+/).filter(Boolean);
  if(!toks.length) return { bad: '' };
  const chords = [];
  for(const tok of toks){
    const c = btParseChord(tok);
    if(!c) return { bad: tok };
    c.pc = (keyIdx + BT_MAJOR[c.degree] - c.flat + 12) % 12;
    c.name = btSpellRoot(keyIdx, c.degree, c.pc) + (c.q === 'min' ? 'm' : c.q === 'dim' ? '°' : '');
    c.label = c.num + ' · ' + c.name;
    c.third = c.q === 'maj' ? 4 : 3;
    c.fifth = c.q === 'dim' ? 6 : 7;
    chords.push(c);
  }
  return { plan: {
    chords, per, key: BT_KEYS[keyIdx],
    norm: chords.map((c) => c.num).join(' '),
    loopBars: Math.ceil(chords.length * per),
  } };
}
/* Bass roots stay E1..D#2, pad roots stay in octave 3. */
function btBassRoot(pc){ return 28 + ((pc - 4 + 12) % 12); }
function btPadRoot(pc){ return 48 + pc; }
function btHz(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

/* ---------------- backing track: voices ---------------- */
const BT_FADE = 0.004;       // ends each decay at zero so a cut note never clicks
const BT_BW_Q = -3.01;       // Web Audio lowpass/highpass Q is in dB: this is a flat Butterworth
const BT_DRUM_MIX = 0.9;
const BT_PAD_LEVEL = 0.32 / 12;   // 12 saws summed, then 0.32 overall
/* Stands in for the approved render's peak normalization, which can't be done
   live: the default mix peaks just under full scale. */
const BT_TRIM = 0.55;
let btOut = null, btNoiseBuf = null, btSaw = null, btParts = null;

function btEnsureGraph(){
  ensureCtx();
  if(btOut && btOut.context === ctx) return;
  // Clip guard: untouched below 0.9, rounds off above it and can never pass 1.0.
  // Only sliders pushed past 100% should reach it. The curve spans input -2..2,
  // so the signal is halved going in.
  const N = 8193, curve = new Float32Array(N);
  for(let i = 0; i < N; i++){
    const x = 4 * i / (N - 1) - 2, a = Math.abs(x);
    curve[i] = Math.sign(x) * (a < 0.9 ? a : 0.9 + 0.1 * Math.tanh((a - 0.9) / 0.1));
  }
  const guard = ctx.createWaveShaper(); guard.curve = curve;
  const trim = ctx.createGain(); trim.gain.value = BT_TRIM * 0.5;
  trim.connect(guard); guard.connect(master);
  btOut = trim;
  // Saw that starts at -1 and rises, as in the approved sound. The built-in
  // sawtooth starts at 0, which changes how it adds up with the bass sine.
  const real = new Float32Array(129), imag = new Float32Array(129);
  for(let h = 1; h <= 128; h++) imag[h] = -2 / (Math.PI * h);
  btSaw = ctx.createPeriodicWave(real, imag, { disableNormalization: true });
  const n = Math.round(ctx.sampleRate * 2);
  btNoiseBuf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = btNoiseBuf.getChannelData(0);
  // Gaussian noise, standard deviation 1
  for(let i = 0; i < n; i++)
    d[i] = Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
}
/* value(t) = peak * e^(-k t), fading to exactly zero at t + len */
function btDecay(param, t, peak, k, len){
  const fadeAt = len - BT_FADE;
  param.setValueAtTime(peak, t);
  param.setTargetAtTime(0, t, 1 / k);
  param.setValueAtTime(peak * Math.exp(-k * fadeAt), t + fadeAt);
  param.linearRampToValueAtTime(0, t + len);
}
/* Silent until its envelope starts. A new gain defaults to 1, so a noise hit that
   starts a fraction of a sample early would otherwise spike at full level. */
function btEnvGain(){
  const g = ctx.createGain();
  g.gain.value = 0;
  return g;
}
function btFilter(type, hz){
  const f = ctx.createBiquadFilter();
  f.type = type; f.frequency.value = hz; f.Q.value = BT_BW_Q;
  return f;
}
function btNoise(t, len, into){
  const src = ctx.createBufferSource();
  src.buffer = btNoiseBuf;
  src.connect(into);
  // Start on whole samples. In between, the browser interpolates and dulls the noise.
  const sr = ctx.sampleRate;
  const offset = Math.floor(Math.random() * (btNoiseBuf.length - (len + 0.01) * sr));
  t = Math.round(t * sr) / sr;
  src.start(t, offset / sr);
  src.stop(t + len);
}
function btKick(t){
  const len = 0.35;
  const o = ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.setTargetAtTime(50, t, 1 / 30);   // 50 + 110 e^(-30t)
  const g = btEnvGain();
  btDecay(g.gain, t, 0.9, 9, len);
  o.connect(g); g.connect(btParts.drums);
  o.start(t); o.stop(t + len);
  const cg = btEnvGain();
  btDecay(cg.gain, t, 0.9 * 0.3, 300, 0.03);
  cg.connect(btParts.drums);
  btNoise(t, 0.03, cg);
}
function btSnare(t){
  const len = 0.45, out = 0.75;
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 190;
  const og = btEnvGain();
  btDecay(og.gain, t, out * 0.5, 25, len);
  o.connect(og); og.connect(btParts.drums);
  o.start(t); o.stop(t + len);
  // noise body, 1.5 to 8 kHz
  const hp = btFilter('highpass', 1500), lp = btFilter('lowpass', 8000);
  const ng = btEnvGain();
  btDecay(ng.gain, t, out * 0.8, 11, len);
  hp.connect(lp); lp.connect(ng); ng.connect(btParts.drums);
  btNoise(t, len, hp);
  // gated room: full level until 0.22s, then cut fast
  const rf = btFilter('lowpass', 5000);
  const rg = btEnvGain();
  rg.gain.setValueAtTime(out * 0.18, t);
  rg.gain.setTargetAtTime(0, t + 0.22, 1 / 60);
  rf.connect(rg); rg.connect(btParts.drums);
  btNoise(t, len, rf);
}
function btHat(t, open){
  const len = open ? 0.25 : 0.12;
  const hp = btFilter('highpass', 7000);
  const g = btEnvGain();
  btDecay(g.gain, t, 0.22, open ? 14 : 45, len);
  hp.connect(g); g.connect(btParts.drums);
  btNoise(t, len, hp);
}
/* Count-in goes straight to the play bus so muting drums can't silence it. */
function btStick(t){
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 1800;
  const g = btEnvGain();
  btDecay(g.gain, t, 0.5 * BT_DRUM_MIX, 80, 0.06);
  o.connect(g); g.connect(playBus);
  o.start(t); o.stop(t + 0.06);
}
function btBassNote(t, midi, len){
  const hz = btHz(midi), peak = 0.5;
  const sine = ctx.createOscillator(); sine.type = 'sine'; sine.frequency.value = hz;
  const saw = ctx.createOscillator(); saw.setPeriodicWave(btSaw); saw.frequency.value = hz;
  const lp = btFilter('lowpass', 900);
  const sg = ctx.createGain(); sg.gain.value = 0.7;
  const wg = ctx.createGain(); wg.gain.value = 0.3;
  const env = ctx.createGain();
  sine.connect(sg); sg.connect(env);
  saw.connect(lp); lp.connect(wg); wg.connect(env);
  env.connect(btParts.bass);
  const atk = 0.005, fadeAt = len - 0.01;
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(peak * Math.exp(-3 * atk), t + atk);
  env.gain.setTargetAtTime(0, t + atk, 1 / 3);
  env.gain.setValueAtTime(peak * Math.exp(-3 * fadeAt), t + fadeAt);
  env.gain.linearRampToValueAtTime(0, t + len);
  sine.start(t); saw.start(t);
  sine.stop(t + len); saw.stop(t + len);
}
function btPadStart(t, chord){
  const root = btPadRoot(chord.pc);
  const lp = btFilter('lowpass', 1800);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(BT_PAD_LEVEL, t + 0.08);
  lp.connect(g); g.connect(btParts.pad);
  const oscs = [];
  for(const semi of [0, chord.third, chord.fifth, 12]){
    const hz = btHz(root + semi);
    for(const ratio of [0.996, 1, 1.004]){
      const o = ctx.createOscillator(); o.setPeriodicWave(btSaw);
      o.frequency.value = hz * ratio;
      o.connect(lp); o.start(t);
      oscs.push(o);
    }
  }
  return { oscs, g };
}
/* The 60ms release finishes right at the chord change. */
function btPadRelease(v, tEnd){
  v.g.gain.setValueAtTime(BT_PAD_LEVEL, tEnd - 0.06);
  v.g.gain.linearRampToValueAtTime(0, tEnd);
  for(const o of v.oscs) o.stop(tEnd);
}
function btPartLevel(k){
  if(bt.mutes[k]) return 0;
  return (k === 'drums' ? BT_DRUM_MIX : 1) * bt.vols[k] / 100;
}
function btApplyVols(){
  if(!btParts || !ctx) return;
  for(const k of ['drums', 'bass', 'pad'])
    btParts[k].gain.setTargetAtTime(btPartLevel(k), ctx.currentTime, 0.01);
}

/* ---------------- backing track: scheduler ---------------- */
let btPlaying = false, btS = null, btRaf = 0;

/* Every bar time comes from anchorT + barCount * barDur and never adds up
   small steps, so the grid can't drift. A BPM change moves the anchor to the
   bar line where it takes effect. */
function btArm(t0){
  playBus = ctx.createGain(); playBus.connect(btOut);
  btParts = {};
  for(const k of ['drums', 'bass', 'pad']){
    btParts[k] = ctx.createGain();
    btParts[k].gain.value = btPartLevel(k);
    btParts[k].connect(playBus);
  }
  btS = {
    anchorT: t0, anchorBar: 0, barDur: 240 / bt.bpm,
    barNo: 0, step: 0, chord: 0, chordStep: 0, padDone: false, hatBar: 0,
    counting: bt.countIn, pad: null, queue: [], t0,
  };
}
function btBarTime(s, n){ return s.anchorT + (n - s.anchorBar) * s.barDur; }
function btStepTime(s){ return btBarTime(s, s.barNo) + s.step * s.barDur / 8; }

/* The chord after this one. A waiting change only counts if this chord would
   reach the bar line, since changes apply there. */
function btNextChord(s){
  const steps = btPlan.per * 8, toBarLine = s.chordStep + (8 - s.step);
  if(toBarLine > steps) return btPlan.chords[(s.chord + 1) % btPlan.chords.length];
  const plan = btPending ? btPending.plan : btPlan;
  if(btPending && btPending.restart) return plan.chords[0];
  const idx = toBarLine === steps ? s.chord + 1 : s.chord;
  return plan.chords[idx % plan.chords.length];
}
function btBeginBar(s){
  const t = btBarTime(s, s.barNo), dur = 240 / bt.bpm;
  if(dur !== s.barDur){ s.anchorT = t; s.anchorBar = s.barNo; s.barDur = dur; }
  if(s.counting){
    s.queue.push({ t, beat: dur / 4, count: true, plan: btPending ? btPending.plan : btPlan,
                   idx: -1, step: 0, beatsAtStart: 4 });
    return;
  }
  if(btPending){
    if(s.pad){ btPadRelease(s.pad, t); s.pad = null; }
    if(btPending.restart){ s.chord = 0; s.chordStep = 0; s.hatBar = 0; }
    btPlan = btPending.plan;
    btPending = null;
    s.padDone = false;
  }
}
/* Starts the pad and books its release. The release waits until the chord ends
   inside the current bar, because BPM can still change at any later bar line. */
function btChordStep(s, t){
  const plan = btPlan, left = plan.per * 8 - s.chordStep;
  // a step that has already gone by (timers stalled) doesn't need its pad
  if(!s.pad && !s.padDone && t + s.barDur / 8 >= ctx.currentTime){
    s.pad = btPadStart(t, plan.chords[s.chord]);
  }
  if(s.pad && s.step + left <= 8){
    btPadRelease(s.pad, btBarTime(s, s.barNo) + (s.step + left) * s.barDur / 8);
    s.pad = null;
    s.padDone = true;
  }
  if(s.step === 0 || s.chordStep === 0){
    s.queue.push({
      t, beat: s.barDur / 4, plan, idx: s.chord, step: s.step, beatsAtStart: left / 2,
      pos: Math.floor(s.chord * plan.per + s.chordStep / 8) + 1, loopBars: plan.loopBars,
    });
  }
}
function btDrumStep(s, t){
  if(s.step === 0 || s.step === 4 || s.step === 5) btKick(t);
  if(s.step === 2 || s.step === 6) btSnare(t);
  btHat(t, s.step === 7 && s.hatBar % 4 === 3);
}
function btBassStep(s, t){
  const chord = btPlan.chords[s.chord], root = btBassRoot(chord.pc);
  if(bt.bass === 'eighths'){
    btBassNote(t, root, s.barDur / 8);
  }else if(bt.bass === 'quarters' && s.step % 2 === 0){
    // root, 5th, octave, 5th, with the chord's last beat leading into the next one
    const leaving = s.chordStep + 2 >= btPlan.per * 8 || (!!btPending && s.step === 6);
    const midi = leaving ? btBassRoot(btNextChord(s).pc) - 1
      : root + [0, chord.fifth, 12, chord.fifth][(s.chordStep % 8) / 2];
    btBassNote(t, midi, s.barDur / 4);
  }
}
function btDoStep(s){
  if(s.step === 0) btBeginBar(s);
  const t = btStepTime(s);
  if(!s.counting) btChordStep(s, t);
  // timers stalled past this step: stay on the grid but don't play it late
  if(t >= ctx.currentTime){
    if(s.counting){ if(s.step % 2 === 0) btStick(t); }
    else { btDrumStep(s, t); btBassStep(s, t); }
  }
  s.step++;
  if(!s.counting){
    s.chordStep++;
    if(s.chordStep >= btPlan.per * 8){
      s.chordStep = 0;
      s.chord = (s.chord + 1) % btPlan.chords.length;
      s.padDone = false;
    }
  }
  if(s.step === 8){
    s.step = 0; s.barNo++;
    if(s.counting) s.counting = false; else s.hatBar++;
  }
}
function btSchedUntil(horizon){
  const s = btS;
  while(btStepTime(s) < horizon) btDoStep(s);
}
function btTick(myToken){
  if(myToken !== token || !btPlaying) return;
  btSchedUntil(ctx.currentTime + LOOKAHEAD);
}

/* ---------------- backing track: transport ---------------- */
let btWake = null;
async function btWakeOn(){
  // keeps the screen on while playing, so the phone doesn't lock and stop the audio
  if(!('wakeLock' in navigator) || document.hidden || btWake) return;
  try{
    const lock = await navigator.wakeLock.request('screen');
    if(btPlaying) btWake = lock; else lock.release().catch(() => {});
  }catch(e){ console.warn('wake lock refused', e); }
}
function btWakeOff(){
  if(btWake){ btWake.release().catch(() => {}); btWake = null; }
}
function btStart(){
  if(!btPlan || $('btPlay').disabled) return;
  btEnsureGraph();
  const myToken = ++token;
  const cold = !warmed || ctx.state !== 'running';
  const go = () => {
    if(myToken !== token) return;
    warmup();
    warmed = true;
    btArm(ctx.currentTime + (cold ? 0.30 : 0.12));
    btPlaying = true;
    $('btPlay').textContent = 'Stop';
    btSchedUntil(ctx.currentTime + LOOKAHEAD);
    schedTimer = setInterval(() => btTick(myToken), TICK);
    btWakeOn();
    cancelAnimationFrame(btRaf);
    btRaf = requestAnimationFrame(btFrame);
  };
  if(ctx.state !== 'running'){
    ctx.resume().then(go).catch((e) => {
      console.warn('audio resume failed', e);
      btShowErr("Audio didn't start. Tap Play again.");
    });
  }else go();
}
function btHalt(){
  if(!btPlaying) return;
  ++token;
  if(btS && btS.pad) for(const o of btS.pad.oscs) o.stop(ctx.currentTime + 0.01);
  killVoices();
  btPlaying = false; btS = null; btParts = null;
  if(btPending){ btPlan = btPending.plan; btPending = null; }
  $('btPlay').textContent = 'Play';
  btWakeOff();
  cancelAnimationFrame(btRaf);
  btCheckProg();
  btRender();
}
/* Key, progression and bars-per-chord all change at the next bar line while
   playing. A new progression or bar count restarts the loop. A new key keeps
   its place in the loop. */
function btApplySettings(){
  const r = btBuildPlan(bt.key, bt.prog, bt.per);
  if(!r.plan) return;
  if(btPlaying){
    const restart = (btPending && btPending.restart) ||
        r.plan.norm !== btPlan.norm || r.plan.per !== btPlan.per;
    btPending = { plan: r.plan, restart };
    const last = btS.queue[btS.queue.length - 1];
    if(last && !last.count) last.beatsAtStart = Math.min(last.beatsAtStart, (8 - last.step) / 2);
  }else{
    btPlan = r.plan;
    btRender();
  }
  btRenderPresets();
}

/* ---------------- backing track: display ---------------- */
function btSetText(el, s){ if(el.textContent !== s) el.textContent = s; }
function btRenderChips(plan, idx){
  const wrap = $('btChips');
  if(wrap.btPlan !== plan){
    wrap.btPlan = plan; wrap.btIdx = -1;
    $('btKeyBig').textContent = 'Key of ' + plan.key;
    wrap.style.gridTemplateColumns = 'repeat(' + Math.min(4, plan.chords.length) + ',1fr)';
    wrap.innerHTML = '';
    for(const ch of plan.chords){
      const chip = document.createElement('div');
      chip.className = 'btChip';
      const n = document.createElement('div'); n.className = 'n'; n.textContent = ch.num;
      const c = document.createElement('div'); c.className = 'c'; c.textContent = ch.name;
      chip.append(n, c);
      wrap.appendChild(chip);
    }
  }
  if(wrap.btIdx !== idx){
    if(wrap.btIdx >= 0) wrap.children[wrap.btIdx].classList.remove('now');
    if(idx >= 0) wrap.children[idx].classList.add('now');
    wrap.btIdx = idx;
  }
}
function btRender(){
  const elNext = $('btNext'), elCount = $('btCountdown'), elBar = $('btBar');
  if(!btPlaying || !btS){
    btRenderChips(btPlan, -1);
    btSetText(elNext, '');
    btSetText(elCount, '');
    btSetText(elBar, 'Bar 1 / ' + btPlan.loopBars);
    return;
  }
  // currentTime runs ahead of what you hear by the output latency
  const now = ctx.currentTime - (ctx.outputLatency || 0);
  const q = btS.queue;
  while(q.length > 1 && q[1].t <= now) q.shift();
  const e = q[0];
  if(!e) return;
  const beat = Math.max(0, Math.min(e.beatsAtStart - 1, Math.floor((now - e.t) / e.beat)));
  btRenderChips(e.plan, e.idx);
  btSetText(elNext, e.count ? 'Starting in' : 'Change in');
  btSetText(elCount, String(e.beatsAtStart - beat));
  btSetText(elBar, e.count ? 'Count-in' : 'Bar ' + e.pos + ' / ' + e.loopBars);
}
function btFrame(){
  if(!btPlaying) return;
  btRender();
  btRaf = requestAnimationFrame(btFrame);
}

/* ---------------- backing track: dice ---------------- */
const BT_DICE_CHORDS = ['I', 'ii', 'iii', 'IV', 'V', 'vi'];
/* How well each chord moves to each other chord. Rows and columns follow
   BT_DICE_CHORDS. Zero means never, so ii V I can come up and I V ii can't. */
const BT_DICE_MOVES = [
  /* I   */ [0.5,   2,   1,   5,   5,   4],
  /* ii  */ [0.5,   0, 0.5,   1,   8, 0.5],
  /* iii */ [0.5,   1,   0,   4, 0.5,   6],
  /* IV  */ [  5,   2, 0.5, 0.5,   6,   2],
  /* V   */ [  7,   0, 0.5,   2,   1,   4],
  /* vi  */ [  2,   5,   1,   6,   3,   0],
];
const BT_DICE_FIRST = [4, 1.5, 0.3, 1.5, 0.3, 3];   // loops rarely start on iii or V
/* Scores every 4-chord loop, including the move from the last chord back to
   the first, then picks one in proportion to its score. */
function btDiceTable(){
  const table = [];
  let total = 0;
  const n = BT_DICE_CHORDS.length;
  for(let a = 0; a < n; a++) for(let b = 0; b < n; b++)
  for(let c = 0; c < n; c++) for(let d = 0; d < n; d++){
    if(![a, b, c, d].some((x) => x === 0 || x === 5)) continue;  // needs a home chord, I or vi
    const m = BT_DICE_MOVES;
    const w = BT_DICE_FIRST[a] * m[a][b] * m[b][c] * m[c][d] * m[d][a];
    if(w > 0){ total += w; table.push({ seq: [a, b, c, d], total }); }
  }
  return table;
}
const btDiceSeqs = btDiceTable();
function btRollProgression(){
  const r = Math.random() * btDiceSeqs[btDiceSeqs.length - 1].total;
  let lo = 0, hi = btDiceSeqs.length - 1;
  while(lo < hi){ const m = (lo + hi) >> 1; if(btDiceSeqs[m].total <= r) lo = m + 1; else hi = m; }
  return btDiceSeqs[lo].seq.map((i) => BT_DICE_CHORDS[i]).join(' ');
}
/* Normal around 140, redrawn until it lands in 90 to 160. */
function btRollBpm(){
  for(;;){
    const z = Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
    const v = Math.round(140 + 16 * z);
    if(v >= 90 && v <= 160) return v;
  }
}
function btDice(){
  const cur = btBuildPlan(bt.key, bt.prog, bt.per).plan.norm;
  let prog = btRollProgression();
  while(prog === cur) prog = btRollProgression();
  bt.key = Math.floor(Math.random() * 12);
  $('btProg').value = prog;
  btRenderToggles();
  btSetBpm(btRollBpm());
  btCommitProg();
}

/* ---------------- backing track: controls ---------------- */
function btShowErr(msg){ $('btErr').textContent = msg; }
function btCheckProg(){
  const text = $('btProg').value;
  const r = btBuildPlan(bt.key, text, bt.per);
  $('btProg').classList.toggle('bad', !r.plan);
  if(r.plan) btShowErr('');
  else btShowErr(r.bad === '' ? 'Type a progression.' : "Can't read \"" + r.bad + '".');
  $('btPlay').disabled = !r.plan && !btPlaying;
  $('btSave').disabled = !r.plan;
  return r.plan;
}
function btCommitProg(){
  if(!btCheckProg()) return;
  bt.prog = $('btProg').value.trim();
  btApplySettings();
  btSaveState();
}
function btRenderPresets(){
  const wrap = $('btPresets');
  wrap.innerHTML = '';
  const cur = btBuildPlan(bt.key, $('btProg').value, bt.per);
  const curNorm = cur.plan ? cur.plan.norm : null;
  const add = (p) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.classList.toggle('on', btBuildPlan(bt.key, p.prog, 1).plan.norm === curNorm);
    btn.onclick = () => { $('btProg').value = p.prog; btCommitProg(); };
    wrap.appendChild(btn);
  };
  BT_PRESETS.forEach(add);
  btCustom.forEach(add);
  const mine = btCustom.some((p) => btBuildPlan(bt.key, p.prog, 1).plan.norm === curNorm);
  $('btDelete').style.display = mine ? 'block' : 'none';
}
function btSavePreset(){
  const plan = btCheckProg();
  if(!plan) return;
  const typed = $('btPresetName').value.trim(), name = typed || plan.norm;
  const known = BT_PRESETS.concat(btCustom).some((p) =>
      btBuildPlan(bt.key, p.prog, 1).plan.norm === plan.norm && (!typed || p.name === name));
  if(known) return;
  btCustom = btCustom.filter((p) => p.name !== name);
  btCustom.push({ name, prog: plan.norm });
  btSaveCustom();
  $('btPresetName').value = '';
  btRenderPresets();
}
function btDeletePreset(){
  const plan = btCheckProg();
  if(!plan) return;
  btCustom = btCustom.filter((p) => btBuildPlan(bt.key, p.prog, 1).plan.norm !== plan.norm);
  btSaveCustom();
  btRenderPresets();
}
function btSetBpm(v){
  bt.bpm = Math.max(40, Math.min(200, Math.round(v)));
  $('btBpm').value = bt.bpm;
  $('btBpmBig').textContent = bt.bpm;
  btSaveState();
}
function btRenderToggles(){
  for(const b of $('btKeys').children) b.classList.toggle('on', +b.dataset.v === bt.key);
  for(const b of $('btBars').children) b.classList.toggle('on', +b.dataset.v === bt.per);
  for(const b of $('btBass').children) b.classList.toggle('on', b.dataset.v === bt.bass);
  $('btCountIn').classList.toggle('on', bt.countIn);
  for(const b of document.querySelectorAll('[data-mute]'))
    b.classList.toggle('on', bt.mutes[b.dataset.mute]);
}
function btInitUI(){
  BT_KEYS.forEach((name, i) => {
    const b = document.createElement('button');
    b.textContent = name; b.dataset.v = i;
    b.onclick = () => { bt.key = i; btRenderToggles(); btApplySettings(); btSaveState(); };
    $('btKeys').appendChild(b);
  });
  for(const b of $('btBars').children)
    b.onclick = () => { bt.per = +b.dataset.v; btRenderToggles(); btApplySettings(); btSaveState(); };
  for(const b of $('btBass').children)
    b.onclick = () => { bt.bass = b.dataset.v; btRenderToggles(); btSaveState(); };
  for(const b of $('btBpmRow').children)
    b.onclick = () => btSetBpm(bt.bpm + (+b.dataset.d));
  $('btBpm').oninput = () => btSetBpm(+$('btBpm').value);
  for(const el of document.querySelectorAll('[data-part]')){
    el.value = bt.vols[el.dataset.part];
    el.oninput = () => { bt.vols[el.dataset.part] = +el.value; btApplyVols(); btSaveState(); };
  }
  for(const b of document.querySelectorAll('[data-mute]'))
    b.onclick = () => {
      bt.mutes[b.dataset.mute] = !bt.mutes[b.dataset.mute];
      btRenderToggles(); btApplyVols(); btSaveState();
    };
  $('btCountIn').onclick = () => { bt.countIn = !bt.countIn; btRenderToggles(); btSaveState(); };
  $('btPlay').onclick = () => { if(btPlaying) btHalt(); else btStart(); };
  $('btDice').onclick = btDice;
  $('btBack').onclick = showMap;
  $('btnBacking').onclick = showBacking;
  const prog = $('btProg');
  prog.value = bt.prog;
  // while playing, wait for Done so half-typed progressions don't play
  prog.oninput = () => { if(btCheckProg() && !btPlaying) btCommitProg(); };
  prog.onchange = btCommitProg;
  prog.onkeydown = (e) => { if(e.key === 'Enter') prog.blur(); };
  $('btSave').onclick = btSavePreset;
  $('btDelete').onclick = btDeletePreset;
  $('btBpm').value = bt.bpm;
  $('btBpmBig').textContent = bt.bpm;
  btRenderToggles();
  btRenderPresets();
  btRender();
}
function showBacking(){
  stop();
  $('mapScreen').style.display = 'none';
  $('playScreen').style.display = 'none';
  $('btScreen').style.display = '';
  document.body.dataset.theme = 'backing';
  btRender();
}
btLoadState();
btInitUI();

/* ---------------- wiring ---------------- */
$('btnMap').onclick = showMap;

$('btnPlay').onclick = togglePlay;
$('btnStop').onclick = stop;
$('btnLoop').onclick = () => {
  if(loopOn) { loopOn = false; }
  else {
    if(loopB <= loopA){ loopA = 0; loopB = totalBeats; }
    loopOn = true; loopCount = 0;
  }
  updateLoopUI(); saveState(); draw();
};
$('btnClear').onclick = clearLoop;
$('nShiftL').onclick = () => shiftLoop(-2);
$('nShiftR').onclick = () => shiftLoop(2);
$('nSizeD').onclick = () => resizeLoop(-2);
$('nSizeU').onclick = () => resizeLoop(2);
$('tempo').oninput = () => setPct(+$('tempo').value);
for(const b of document.querySelectorAll('.presets button'))
  b.onclick = () => setPct(+b.dataset.pct);
$('btnTrainer').onclick = () => {
  trainerOn = !trainerOn; loopCount = 0;
  $('btnTrainer').classList.toggle('on', trainerOn);
};
for(const b of document.querySelectorAll('[data-back]'))
  b.onclick = () => {
    backing = b.dataset.back;
    for(const x of document.querySelectorAll('[data-back]'))
      x.classList.toggle('on', x === b);
    saveState();
  };
$('trainN').onchange = () => saveState();

document.addEventListener('keydown', (e) => {
  if(e.target.tagName === 'INPUT') return;
  if($('btScreen').style.display !== 'none'){
    if(e.code === 'Space'){ e.preventDefault(); $('btPlay').click(); }
    return;
  }
  if(e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key === 'ArrowLeft') shiftLoop(-2);
  else if(e.key === 'ArrowRight') shiftLoop(2);
  else if(e.key === '-' || e.key === '_') resizeLoop(-2);
  else if(e.key === '+' || e.key === '=') resizeLoop(2);
  else if(e.key === 'Escape') clearLoop();
});

/* iOS suspends AudioContext on app switch: revive on return */
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && ctx && ctx.state === 'suspended'){
    ctx.resume().then(() => warmup()).catch(() => {});
  }
  if(!document.hidden && btPlaying) btWakeOn();
  if(document.hidden) btWake = null;   // the browser drops the lock when hidden
});
window.addEventListener('resize', () => {
  if(song && $('playScreen').style.display !== 'none'){ renderStatic(); renderSectionsStrip(); draw(); }
  if($('mapScreen').style.display !== 'none') renderMap();
});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

showMap();
rafLoop();
</script>
